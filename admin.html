<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>admin panel</title>
<style>
  body { background: #0a0505; color: #f0d9d9; font-family: monospace; padding: 20px; }
  .box { max-width: 800px; margin: 0 auto; }
  input { width: 100%; padding: 10px; margin-bottom: 10px; background: #140808; border: 1px solid #3d1a1a; color: #fff; box-sizing: border-box; }
  button { padding: 10px 20px; background: #ff2a2a; border: none; color: #000; font-weight: bold; cursor: pointer; }
  button:hover { background: #ff6b6b; }
  .post { background: #1a0a0a; border: 1px solid #3d1a1a; padding: 15px; margin-bottom: 10px; border-radius: 4px; }
  .post h3 { color: #ff2a2a; margin-bottom: 5px; }
  .post .del { background: #ff5566; color: #fff; padding: 5px 10px; border: none; cursor: pointer; margin-top: 10px; border-radius: 4px; }
  .post .del:hover { background: #ff2a2a; }
  .hidden { display: none; }
  p { margin-bottom: 5px; }
</style>
</head>
<body>

<div id="loginScreen" class="box">
  <h2 style="color:#ff2a2a; margin-bottom:20px;">Вход в админку</h2>
  <input type="password" id="passInput" placeholder="Пароль (admin123)">
  <button onclick="doLogin()">Войти</button>
</div>

<div id="adminScreen" class="box hidden">
  <h2 style="color:#ff2a2a; margin-bottom:20px;">Управление пастами</h2>
  <button onclick="loadPosts()" style="margin-bottom:20px;">Обновить список</button>
  <div id="postsList"></div>
</div>

<script>
  const ADMIN_PASSWORD = "admin123";
  const KEY_POSTS = "bestosint_posts_global";

  function doLogin() {
    var pass = document.getElementById("passInput").value;
    if (pass === ADMIN_PASSWORD) {
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("adminScreen").classList.remove("hidden");
      loadPosts();
    } else {
      alert("Неверный пароль");
    }
  }

  function loadPosts() {
    var posts = [];
    try {
      var raw = localStorage.getItem(KEY_POSTS);
      if (raw) posts = JSON.parse(raw);
    } catch(e) {}

    var list = document.getElementById("postsList");
    list.innerHTML = "";

    if (posts.length === 0) {
      list.innerHTML = "<p style='color:#6b3a3a;'>Паст пока нет.</p>";
      return;
    }

    posts.forEach(function(p) {
      var el = document.createElement("div");
      el.className = "post";
      el.innerHTML = `
        <h3>#${p.id} ${p.title}</h3>
        <p style="color:#a86a6a; font-size:12px;">Автор: @${p.author} | ${new Date(p.createdAt).toLocaleString()}</p>
        <p>${p.body}</p>
        <button class="del" onclick="deletePost(${p.id})">Удалить</button>
      `;
      list.appendChild(el);
    });
  }

  function deletePost(id) {
    if (!confirm("Удалить пасту #" + id + "?")) return;
    var posts = [];
    try {
      var raw = localStorage.getItem(KEY_POSTS);
      if (raw) posts = JSON.parse(raw);
    } catch(e) {}

    posts = posts.filter(function(p) { return p.id !== id; });
    localStorage.setItem(KEY_POSTS, JSON.stringify(posts));
    loadPosts();
  }
</script>
</body>
</html>
